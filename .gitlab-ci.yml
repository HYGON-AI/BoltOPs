stages:
  - prepare
  - build
  - publish

variables:
  GIT_DEPTH: "0"
  PIP_INDEX_URL: "http://10.16.1.201:9929/nightly/dtk2604/+simple/"
  PIP_TRUSTED_HOST: "10.16.1.201"
  DTK_PKG: "/ArchivedFile/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz"
  DEVPI_URL: "http://10.16.1.201:9929/"
  CISMI_TIMEOUT: "3600"


.dcu-runner:
  tags:
    - nmz
  before_script:
    # Keep the DTK/AICC setup aligned with triton-staging so both projects use
    # the same compiler and runtime on the shared runner.
    - cp -f ${DTK_PKG} /opt/
    - cd /opt && tar -xzf $(basename ${DTK_PKG}) && mv dtk-* dtk
    - source /opt/dtk/env.sh && cd ${CI_PROJECT_DIR}
    - src_dir="/ArchivedFile/ai_cc/nightly"
    - latest_run=$(cd "$src_dir" && ls dtk_llvm_*.run 2>/dev/null | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
    - 'echo "AICC installer: ${src_dir}/${latest_run}.run"'
    - test -n "${latest_run}"
    - cp "${src_dir}/${latest_run}.run" ./
    - chmod +x "${latest_run}.run"
    - 'yes | bash "${latest_run}.run" || test "${PIPESTATUS[1]}" -eq 0'

.git-auth:
  before_script:
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod +x /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh GIT_TERMINAL_PROMPT=0 GIT_TOKEN="${CI_JOB_TOKEN}"

select:source:
  stage: prepare
  tags:
    - nmz
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "main"'
  before_script:
    - !reference [.git-auth, before_script]
  script:
    - |
      BOLTOPS_SOURCE_SHA="${CI_COMMIT_SHA}"
      if [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        BOLTOPS_TARGET_SHA=$(git rev-parse FETCH_HEAD)
      else
        BOLTOPS_TARGET_SHA="${CI_COMMIT_SHA}"
      fi
      printf 'BOLTOPS_SOURCE_SHA=%s\n' "${BOLTOPS_SOURCE_SHA}" > source.env
      printf 'BOLTOPS_TARGET_SHA=%s\n' "${BOLTOPS_TARGET_SHA}" >> source.env
      echo "Source commit: ${BOLTOPS_SOURCE_SHA}"
      echo "Target commit: ${BOLTOPS_TARGET_SHA}"
  artifacts:
    reports:
      dotenv: source.env
    expire_in: 1 day

build:test-wheel:
  extends: .dcu-runner
  stage: build
  timeout: 3h
  needs:
    - job: select:source
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "main"'
  parallel:
    matrix:
      - TORCH_VERSION: ["2.10.0", "2.11.0"]
  before_script:
    - !reference [.dcu-runner, before_script]
    - !reference [.git-auth, before_script]
    # Both Torch matrix jobs integrate the exact target commit selected once
    # by select:source, matching the source selection used by HYGON-AI/lightop.
    - |
      test "$(git rev-parse HEAD)" = "${BOLTOPS_SOURCE_SHA}"
      if [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        git config user.email "ci@local"
        git config user.name "CI"
        git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        git cat-file -e "${BOLTOPS_TARGET_SHA}^{commit}"
        git merge "${BOLTOPS_TARGET_SHA}" --no-edit
      else
        test "${BOLTOPS_SOURCE_SHA}" = "${BOLTOPS_TARGET_SHA}"
      fi
      echo "Source commit: ${BOLTOPS_SOURCE_SHA}"
      echo "Target commit: ${BOLTOPS_TARGET_SHA}"
      echo "Integrated commit: $(git rev-parse HEAD)"
    - python -m pip install "torch==${TORCH_VERSION}" triton pytest "numpy==1.24.3" pandas build wheel ciupload cismi ninja
    - python -m pip show torch triton
  script:
    - |
      HIP_VISIBLE_DEVICES=$(CIsmi need 1 --timeout "${CISMI_TIMEOUT}")
      test -n "${HIP_VISIBLE_DEVICES}"
      export HIP_VISIBLE_DEVICES
      echo "Allocated DCU: ${HIP_VISIBLE_DEVICES}"
    - DTK_VER=$(echo ${DTK_PKG} | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')
    - GIT_COMMIT=$(git rev-parse --short=6 HEAD)
    - python -m build --wheel
    - CIUpload REPAIR --dtk_version ${DTK_VER} --torch_version ${TORCH_VERSION} --git_commit ${GIT_COMMIT} --outputdir output -f dist/*.whl
    - |
      wheel_test_dir=$(mktemp -d)
      python -m pip install --no-deps --target "${wheel_test_dir}" output/*.whl
      cp -r test "${wheel_test_dir}/test"
      (
        cd "${wheel_test_dir}"
        python -m pytest test -s --tb=short \
          --junitxml="${CI_PROJECT_DIR}/boltops_test.xml"
      )
  artifacts:
    when: always
    paths:
      - output/*.whl
      - boltops_test.xml
    reports:
      junit: boltops_test.xml
    expire_in: 7 days

publish:
  stage: publish
  tags:
    - nmz
  needs:
    - job: build:test-wheel
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "main"'
  before_script:
    - python -m pip install ciupload
  script:
    - ls -l output/*.whl
    - |
      for wheel in output/*.whl; do
        CIUpload --devpi_url "${DEVPI_URL}" \
          --devpi_user "${devpi_nightly_user}" \
          --devpi_password "${devpi_nightly_password}" \
          --dtk_pkg_name "$(basename "${DTK_PKG}")" \
          -f "${wheel}"
      done
  artifacts:
    paths:
      - output/*.whl
    expire_in: 30 days
