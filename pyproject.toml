[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltops"
dynamic = ["version"]
description = "Hygon DCU AI Compiler ops library (Triton & TileLang & Other DSLs)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Hygon DCU AI Compiler" }]
dependencies = [
    "packaging",
    "torch",
]

[project.optional-dependencies]
triton = ["triton"]
tilelang = ["tilelang"]
all = ["triton", "tilelang"]
tune = [
    "triton",
    "pytest",
    "numpy",
    "pandas",
    "matplotlib",
]
dev = [
    "pytest",
    "numpy",
    "pandas",
]

[project.scripts]
boltops-fused-moe-tune-cli = "boltops.tools.triton_moe_tune.tune_moe_cli:main"

[tool.setuptools]
packages = [
    "boltops",
    "boltops.generic",
    "boltops.generic.triton",
    "boltops.fused_moe",
    "boltops.fused_moe.triton",
    "boltops.fused_moe.triton.configs",
    "boltops.fused_moe.tilelang",
    "boltops.gemm",
    "boltops.gemm.triton",
    "boltops.gemm.triton._quant",
    "boltops.gemm.triton.configs",
    "boltops.gemm.tilelang",
    "boltops.mla",
    "boltops.mla.triton",
    "boltops.mla.tilelang",
    "boltops.fla",
    "boltops.fla.common",
    "boltops.fla.common.triton",
    "boltops.fla.kda",
    "boltops.fla.kda.triton",
    "boltops.fla.gdn",
    "boltops.fla.gdn.triton",
    "boltops.fla.gdn.triton.configs",
    "boltops.utility",
    "boltops.fused_moe.triton.moe_sorting_hipc",
    "boltops.tools",
    "boltops.tools.triton_moe_tune",
]

[tool.setuptools.dynamic]
version = { attr = "boltops._version.__version__" }

[tool.setuptools.package-data]
boltops = [
    "fused_moe/triton/moe_sorting_hipc/csrc/*",
    "fused_moe/triton/configs/moe/*.json",
    "gemm/triton/configs/awq_gemm_triton/*.json",
    "gemm/triton/configs/w8a8_block_int8_matmul/*.json",
    "gemm/triton/SOURCE.md",
    "mla/triton/SOURCE.md",
    "fla/gdn/triton/configs/*/*.json",
    "tools/triton_moe_tune/*.sh",
    "tools/triton_moe_tune/*.md",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
markers = [
    "bench: performance benchmark on real-model sizes (requires --bench/--benchmark)",
]
