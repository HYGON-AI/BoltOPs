[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltops"
dynamic = ["version"]
description = "Hygon DCU AI Compiler ops library (Triton & TileLang & Other DSLs)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Hygon DCU AI Compiler" }]
dependencies = [
    "packaging",
    "torch",
]

[project.optional-dependencies]
triton = ["triton"]
tilelang = ["tilelang"]
all = ["triton", "tilelang"]
tune = [
    "triton",
    "pytest",
    "numpy",
    "pandas",
    "matplotlib",
]
dev = [
    "pytest",
    "numpy",
    "pandas",
]

[project.scripts]
boltops-fused-moe-tune-cli = "boltops.tools.fused_moe_triton_tune.tune_moe_cli:main"
boltops-sparse-gqa-tune-cli = "boltops.tools.sparse_gqa_triton_tune.tune_sparse_gqa:main"

[tool.setuptools]
packages = [
    "boltops",
    "boltops.generic",
    "boltops.generic.triton",
    "boltops.generic.triton.causal_conv1d",
    "boltops.fused_moe",
    "boltops.fused_moe.triton",
    "boltops.fused_moe.triton.configs",
    "boltops.fused_moe.tilelang",
    "boltops.gemm",
    "boltops.gemm.triton",
    "boltops.gemm.triton._quant",
    "boltops.gemm.triton.configs",
    "boltops.gemm.tilelang",
    "boltops.step4_dsa",
    "boltops.step4_dsa.triton",
    "boltops.step4_dsa.tilelang",
    "boltops.mla",
    "boltops.mla.triton",
    "boltops.mla.tilelang",
    "boltops.fa",
    "boltops.fa.sparse_gqa",
    "boltops.fa.sparse_gqa.triton",
    "boltops.mqa_logits",
    "boltops.mqa_logits.triton",
    "boltops.mqa_logits.tilelang",
    "boltops.mqa_logits.tilelang.configs",
    "boltops.mqa_logits.tilelang.configs.mqa_decode",
    "boltops.mqa_logits.tilelang.configs.mqa_prefill",
    "boltops.mqa_logits.tilelang.kernels",
    "boltops.mqa_logits.tilelang.kernels.common",
    "boltops.mqa_logits.tilelang.kernels.gfx938",
    "boltops.fla",
    "boltops.fla.common",
    "boltops.fla.common.triton",
    "boltops.fla.kda",
    "boltops.fla.kda.triton",
    "boltops.fla.gdn",
    "boltops.fla.gdn.triton",
    "boltops.fla.gdn.triton.configs",
    "boltops.mhc",
    "boltops.mhc.tilelang",
    "boltops.mhc.tilelang.configs",
    "boltops.mhc.tilelang.configs.pre_big_fuse",
    "boltops.mhc.tilelang.kernels",
    "boltops.mhc.tilelang.kernels.common",
    "boltops.mhc.tilelang.kernels.gfx946",
    "boltops.ihc",
    "boltops.ihc.tilelang",
    "boltops.ihc.tilelang.configs",
    "boltops.ihc.tilelang.configs.pre",
    "boltops.ihc.tilelang.configs.head",
    "boltops.ihc.tilelang.kernels",
    "boltops.ihc.tilelang.kernels.common",
    "boltops.utility",
    "boltops.fused_moe.triton.moe_sorting_hipc",
    "boltops.tools",
    "boltops.tools.fused_moe_triton_tune",
    "boltops.tools.sparse_gqa_triton_tune",
]

[tool.setuptools.dynamic]
version = { attr = "boltops._version.__version__" }

[tool.setuptools.package-data]
boltops = [
    "fused_moe/triton/moe_sorting_hipc/csrc/*",
    "fused_moe/triton/configs/triton_*/*.json",
    "gemm/triton/configs/awq_gemm_triton/*.json",
    "gemm/triton/configs/w8a8_block_int8_matmul/*.json",
    "gemm/triton/SOURCE.md",
    "mla/triton/SOURCE.md",
    "mla/triton/configs/**/*.json",
    "fa/sparse_gqa/triton/configs/triton_*/*.json",
    "mqa_logits/triton/SOURCE.md",
    "mqa_logits/triton/PERFORMANCE.md",
    "mqa_logits/triton/configs/triton_*/*.json",
    "step4_dsa/triton/SOURCE.md",
    "step4_dsa/triton/config/*/*.json",
    "fla/gdn/triton/configs/*/*.json",
    "tools/fused_moe_triton_tune/*.sh",
    "tools/fused_moe_triton_tune/*.md",
    "tools/sparse_gqa_triton_tune/*.sh",
    "tools/sparse_gqa_triton_tune/*.md",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
markers = [
    "slow: long GPU grids skipped unless --runslow",
    "bench: performance benchmark on real-model sizes (requires --bench/--benchmark)",
]
