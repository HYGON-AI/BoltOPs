name: Build and test wheel
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      dtk_version:
        required: true
        type: string
      dtk_ver:
        required: true
        type: string
      py_version:
        required: true
        type: string
      numpy_version:
        type: string
      torch_version:
        type: string
      run_tests:
        required: true
        type: boolean
      run_performance:
        description: Run performance after correctness tests pass
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: hygon-build
    timeout-minutes: 180
    container:
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ inputs.dtk_version }}-rockylinux8.6-py${{ inputs.py_version
        }}
    defaults:
      run:
        shell: bash
    env:
      PYPI_URL: ${{ vars.PYPI_URL }}
      DTK_VER: ${{ inputs.dtk_ver }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify source and integrate PR base
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: bash .github/scripts/checkout-source.sh
    - name: Build wheel without Torch
      run: |
        : "${PYPI_URL:?Set the PYPI_URL repository variable}"
        export PIP_INDEX_URL="${PYPI_URL%/}/nightly/dtk${DTK_VER}/+simple/"
        export PIP_TRUSTED_HOST
        PIP_TRUSTED_HOST=$(python -c 'import os, urllib.parse; print(urllib.parse.urlparse(os.environ["PYPI_URL"]).hostname)')

        build_dir=$(mktemp -d)
        trap 'rm -rf -- "$build_dir"' EXIT
        python -m venv "$build_dir/venv"
        build_python="$build_dir/venv/bin/python"
        "$build_python" -m pip install build

        # Set the nightly version before building so the filename and metadata agree.
        version_file=boltops/_version.py
        cp "$version_file" "$build_dir/_version.py"
        trap 'cp "$build_dir/_version.py" "$version_file"; rm -rf -- "$build_dir"' EXIT
        suffix="dtk${DTK_VER}.$(date -u +%y%m%d%H%M).g$(git rev-parse --short=6 HEAD)"
        "$build_python" - "$version_file" "$suffix" <<'PY'
        import runpy
        import sys
        from pathlib import Path

        path = Path(sys.argv[1])
        version = runpy.run_path(str(path))["__version__"]
        if "+" in version:
            raise SystemExit(f"Expected a base version without a local tag: {version}")
        source = path.read_text(encoding="utf-8")
        assignment = f'__version__ = "{version}"'
        if assignment not in source.splitlines():
            raise SystemExit(f"Expected a literal __version__ assignment in {path}")
        path.write_text(source.replace(assignment, f'__version__ = "{version}+{sys.argv[2]}"', 1), encoding="utf-8")
        PY

        "$build_python" -m build --wheel --outdir "$build_dir/wheels"
        shopt -s nullglob
        wheels=("$build_dir"/wheels/*.whl)
        if [[ ${#wheels[@]} -ne 1 || "${wheels[0]:-}" != *-py3-none-any.whl ]]; then
          echo "Expected exactly one pure Python wheel" >&2
          exit 1
        fi
        mkdir -p output
        cp "${wheels[0]}" output/
    - name: Upload built wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheel-dtk${{ inputs.dtk_ver }}
        path: output/*.whl
        if-no-files-found: error
        retention-days: 7
  correctness:
    if: ${{ inputs.run_tests }}
    needs: build
    runs-on: hygon-bw1100-4card
    timeout-minutes: 180
    container:
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ inputs.dtk_version }}-rockylinux8.6-py${{ inputs.py_version
        }}
    defaults:
      run:
        shell: bash
    env:
      PYPI_URL: ${{ vars.PYPI_URL }}
      AICC_INSTALLER_URL: ${{ vars.AICC_INSTALLER_URL }}
      RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
      PYTHONUNBUFFERED: '1'
      DTK_VER: ${{ inputs.dtk_ver }}
      PYTHON_VERSION: ${{ inputs.py_version }}
      NUMPY_VERSION: ${{ inputs.numpy_version }}
      TORCH_VERSION: ${{ inputs.torch_version }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify source and integrate PR base
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: bash .github/scripts/checkout-source.sh
    - name: Download built wheel
      uses: actions/download-artifact@v4
      with:
        name: wheel-dtk${{ inputs.dtk_ver }}
        path: output/dtk${{ inputs.dtk_ver }}/py${{ inputs.py_version }}/torch${{ inputs.torch_version }}
    - name: Install compiler and dependencies
      run: bash .github/scripts/setup-env.sh
    - name: Verify allocated HCU
      run: |
        source .github/scripts/common.sh
        python - <<'PY'
        import torch

        if not torch.version.hip:
            raise SystemExit('Tests require an HCU/HIP Torch build')
        count = torch.cuda.device_count()
        if count != 4:
            raise SystemExit(f'Expected exactly four ARC-allocated HCUs, found {count}')
        print(f'Allocated HCUs: {count}; logical indices=0..{count - 1}; model={torch.cuda.get_device_name(0)}')
        PY
    - name: Run correctness tests on the allocated HCU
      run: bash .github/scripts/test-correctness.sh
    - name: Upload correctness reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: correctness-reports-dtk${{ inputs.dtk_ver }}-py${{ inputs.py_version }}-torch${{ inputs.torch_version }}
        path: output/**/boltops_test.xml
        if-no-files-found: warn
        retention-days: 7
  performance:
    if: ${{ inputs.run_tests && inputs.run_performance }}
    needs:
    - build
    - correctness
    runs-on: hygon-bw1100-1card
    timeout-minutes: 180
    container:
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ inputs.dtk_version }}-rockylinux8.6-py${{ inputs.py_version }}
    defaults:
      run:
        shell: bash
    env:
      PYPI_URL: ${{ vars.PYPI_URL }}
      AICC_INSTALLER_URL: ${{ vars.AICC_INSTALLER_URL }}
      RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
      PYTHONUNBUFFERED: '1'
      # ARC allocates one HCU, exposed to optest as logical device 0.
      BOLTOPS_TEST_GPU: '0'
      DTK_VER: ${{ inputs.dtk_ver }}
      PYTHON_VERSION: ${{ inputs.py_version }}
      NUMPY_VERSION: ${{ inputs.numpy_version }}
      TORCH_VERSION: ${{ inputs.torch_version }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify source and integrate PR base
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: bash .github/scripts/checkout-source.sh
    - name: Download tested wheel
      uses: actions/download-artifact@v4
      with:
        name: wheel-dtk${{ inputs.dtk_ver }}
        path: output/dtk${{ inputs.dtk_ver }}/py${{ inputs.py_version }}/torch${{ inputs.torch_version }}
    - name: Install compiler and dependencies
      run: bash .github/scripts/setup-env.sh
    - name: Verify allocated HCU
      run: |
        source .github/scripts/common.sh
        python - <<'PY'
        import torch

        if not torch.version.hip:
            raise SystemExit('Tests require an HCU/HIP Torch build')
        count = torch.cuda.device_count()
        if count != 1:
            raise SystemExit(f'Expected exactly one ARC-allocated HCU, found {count}')
        print(f'Allocated HCUs: {count}; logical indices=0..{count - 1}; model={torch.cuda.get_device_name(0)}')
        PY
    - name: Run performance suite
      run: bash .github/scripts/test-performance.sh
    - name: Collect performance output even after failure
      if: ${{ always() }}
      run: |
        # Reconstruct common.sh's identity without loading DTK or dependencies.
        run_branch="ci_performance_BW1100_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${GITHUB_JOB}_${DTK_VER}_${PYTHON_VERSION}_${TORCH_VERSION}"
        artifact_dir="${GITHUB_WORKSPACE}/optest_artifacts/BW1100/dtk${DTK_VER}/py${PYTHON_VERSION}/torch${TORCH_VERSION}"
        mkdir -p "${artifact_dir}"
        for result_dir in /op_test_output/boltops/"${run_branch}"_*; do
          if [ -d "${result_dir}" ]; then
            mkdir -p "${artifact_dir}/results"
            echo "Archiving results: ${result_dir}" | tee -a "${artifact_dir}/collection.log"
            cp -a "${result_dir}" "${artifact_dir}/results/"
          fi
        done
        for log_dir in /op_test_log/boltops/"${run_branch}"_*; do
          if [ -d "${log_dir}" ]; then
            mkdir -p "${artifact_dir}/logs"
            echo "Archiving logs: ${log_dir}" | tee -a "${artifact_dir}/collection.log"
            cp -a "${log_dir}" "${artifact_dir}/logs/"
          fi
        done
    - name: Upload performance reports and logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: performance-reports-dtk${{ inputs.dtk_ver }}-py${{ inputs.py_version }}-torch${{ inputs.torch_version }}
        path: |
          scripts/*_boltops_output.xml
          optest_artifacts/
          optest_results/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
