name: BoltOPs CI
on:
  pull_request_target:
    branches:
    - release/0.1.0
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
    - unlabeled
  push:
    branches:
    - release/0.1.0
  workflow_dispatch:
    inputs:
      dtk_version:
        description: DTK version
        type: choice
        default: '26.10'
        options:
        - '26.04'
        - '26.10'
      py_version:
        description: Python version
        type: choice
        default: '3.12'
        options:
        - '3.10'
        - '3.12'
      commit:
        description: Full commit SHA (leave blank to build the selected branch or tag)
        type: string
permissions:
  contents: read
concurrency:
  group: boltops-ci-${{ (github.event_name == 'workflow_dispatch' || (github.event.label && github.event.label.name != 'ready hcu')) && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  authorize-ci:
    if: >-
      ${{ github.event_name != 'workflow_dispatch' &&
          (!github.event.label || github.event.label.name == 'ready hcu') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    steps:
    - name: Require approval for this fork PR commit
      if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
      uses: actions/github-script@v7
      env:
        HCU_APPROVAL_LABEL: ready hcu
      with:
        script: |
          const { owner, repo } = context.repo;
          const number = context.payload.pull_request.number;
          const sha = context.payload.pull_request.head.sha;
          const label = process.env.HCU_APPROVAL_LABEL;
          const statusContext = `hcu-approval/pr-${number}`;
          const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
          if (pr.state !== 'open' || pr.head.sha !== sha) {
            throw new Error('PR head changed or PR closed. This run cannot use internal runners.');
          }
          if (!pr.labels.some(item => item.name === label)) {
            throw new Error(`Review commit ${sha} and apply ${label} to approve this commit.`);
          }
          const events = await github.paginate(github.rest.issues.listEvents, {
            owner, repo, issue_number: number, per_page: 100,
          });
          const last = events.filter(item =>
            ['labeled', 'unlabeled'].includes(item.event) && item.label?.name === label
          ).sort((a, b) => b.id - a.id)[0];
          if (!last || last.event !== 'labeled' || !last.actor?.login) {
            throw new Error('Cannot verify who applied the active approval label.');
          }
          const { data: collaborator } = await github.rest.repos.getCollaboratorPermissionLevel({
            owner, repo, username: last.actor.login,
          });
          if (!collaborator.user?.permissions?.triage &&
              !['triage', 'write', 'maintain', 'admin'].includes(collaborator.permission)) {
            throw new Error('The approval label must be applied by a repository collaborator with at least triage access.');
          }
          // Bind approval to both the exact head SHA and this application of the label.
          const marker = `label-event:${last.id}`;
          if (context.payload.action === 'labeled' && context.payload.label?.name === label &&
              context.payload.sender.login === last.actor.login) {
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, context: statusContext, state: 'success',
              description: marker,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
          }
          const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
            owner, repo, ref: sha, per_page: 100,
          });
          const approval = statuses.filter(item => item.context === statusContext)
            .sort((a, b) => b.id - a.id)[0];
          if (!approval || approval.state !== 'success' || approval.description !== marker ||
              approval.creator?.login !== 'github-actions[bot]') {
            if (context.payload.action === 'synchronize') {
              // Recheck before changing labels: an old queued run must not touch a new head.
              const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (current.head.sha === sha && current.labels.some(item => item.name === label)) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: label });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            throw new Error(`Commit ${sha} is not approved. Review it, then remove and reapply ${label}.`);
          }
          // Revalidate after API calls before allowing build and test jobs to proceed.
          const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });
          if (current.state !== 'open' || current.head.sha !== sha ||
              !current.labels.some(item => item.name === label)) {
            throw new Error('Approval was revoked or the PR head changed.');
          }
          core.info(`PR #${number} commit ${sha} approved by ${last.actor.login}.`);
    - name: Confirm authorization
      run: echo "CI may proceed."
  validate-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: hygon-cpu
    steps:
    - name: Validate manual build inputs
      shell: bash
      env:
        DTK_VERSION: ${{ inputs.dtk_version }}
        PYTHON_VERSION: ${{ inputs.py_version }}
        SOURCE_SHA: ${{ inputs.commit || github.sha }}
      run: |
        case "${DTK_VERSION}/${PYTHON_VERSION}" in
          26.04/3.10|26.04/3.12|26.10/3.12) ;;
          *)
            echo "Unsupported build combination: DTK ${DTK_VERSION}, Python ${PYTHON_VERSION}." >&2
            exit 1
            ;;
        esac
        if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Enter the full 40-character commit SHA, or leave commit blank." >&2
          exit 1
        fi
  build-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-manual
    name: Build DTK${{ inputs.dtk_version }} (py${{ inputs.py_version }})
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: ${{ inputs.dtk_version }}
      dtk_ver: ${{ inputs.dtk_version == '26.04' && '2604' || '2610' }}
      source_sha: ${{ inputs.commit || github.sha }}
      py_version: ${{ inputs.py_version }}
      run_tests: false
  build2604:
    needs: authorize-ci
    name: DTK2604 (py3.10)
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.04'
      dtk_ver: '2604'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      py_version: '3.10'
      torch_version: '2.11.0'
      run_tests: true
  build2610:
    needs: authorize-ci
    name: DTK2610 (py3.12)
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.10'
      dtk_ver: '2610'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      py_version: '3.12'
      torch_version: '2.13.0'
      run_tests: true
  publish-2604:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/0.1.0' }}
    needs:
    - build2604
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_version: '26.04'
      dtk_ver: '2604'
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  publish-2610:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/0.1.0' }}
    needs:
    - build2610
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_version: '26.10'
      dtk_ver: '2610'
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  ci-result:
    name: ${{ github.event.label && github.event.label.name != 'ready hcu' && 'Ignored label change' || 'ci-result' }}
    if: ${{ always() && github.event_name != 'workflow_dispatch' && (!github.event.label || github.event.label.name == 'ready hcu') }}
    needs:
    - build2604
    - build2610
    runs-on: hygon-cpu
    env:
      BUILD_2604: ${{ needs.build2604.result }}
      BUILD_2610: ${{ needs.build2610.result }}
    steps:
    - name: Require completed CI jobs
      shell: bash
      run: |
        set -euo pipefail
        test "$BUILD_2604" = success
        test "$BUILD_2610" = success
