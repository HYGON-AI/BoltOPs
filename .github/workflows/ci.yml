name: BoltOPs CI
on:
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: boltops-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build2604:
    name: DTK2604 (py${{ matrix.py_version }}, torch${{ matrix.torch_version }})
    strategy:
      fail-fast: false
      matrix:
        py_version: ['3.10', '3.12']
        torch_version: ['2.10.0', '2.11.0']
        include:
        - py_version: '3.10'
          numpy_version: '1.24.3'
        - py_version: '3.12'
          numpy_version: '1.26.4'
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.04'
      dtk_ver: '2604'
      py_version: ${{ matrix.py_version }}
      numpy_version: ${{ matrix.numpy_version }}
      torch_version: ${{ matrix.torch_version }}
      run_tests: ${{ github.event_name != 'push' }}
      run_performance: ${{ matrix.py_version == '3.12' && matrix.torch_version == '2.11.0' }}
  build2610:
    # Each matrix entry runs a CPU build, four-HCU correctness, then performance.
    name: DTK2610 (torch${{ matrix.torch_version }})
    strategy:
      fail-fast: false
      matrix:
        torch_version:
        - '2.11.0'
        - '2.13.0'
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.10'
      dtk_ver: '2610'
      py_version: '3.12'
      numpy_version: '1.26.4'
      torch_version: ${{ matrix.torch_version }}
      run_tests: ${{ github.event_name != 'push' }}
  publish-2604:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
    - build2604
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_version: '26.04'
      dtk_ver: '2604'
      dtk_pkg_name: DTK-26.04-rc4-centos8-x86_64.tar.gz
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  publish-2610:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
    - build2610
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_version: '26.10'
      dtk_ver: '2610'
      dtk_pkg_name: DTK-26.10-Rocky8.6-x86_64.tar.gz
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  ci-result:
    if: ${{ always() }}
    needs:
    - build2604
    - build2610
    runs-on: hygon-cpu
    env:
      BUILD_2604: ${{ needs.build2604.result }}
      BUILD_2610: ${{ needs.build2610.result }}
    steps:
    - name: Require completed CI jobs
      shell: bash
      run: |
        set -euo pipefail
        test "$BUILD_2604" = success
        test "$BUILD_2610" = success
