name: BoltOPs CI
on:
  pull_request_target:
    branches:
    - release/0.1.0
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
    - unlabeled
  push:
    branches:
    - release/0.1.0
  workflow_dispatch:
    inputs:
      dtk_version:
        description: DTK version
        type: choice
        default: '26.10'
        options:
        - '26.04'
        - '26.10'
      py_version:
        description: Python version
        type: choice
        default: '3.12'
        options:
        - '3.10'
        - '3.12'
      commit:
        description: Full commit SHA (leave blank to build the selected branch or tag)
        type: string
permissions:
  contents: read
concurrency:
  group: boltops-ci-${{ (github.event_name == 'workflow_dispatch' || (github.event.label && github.event.label.name != 'ok-to-test')) && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  verify-release-ci:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
    - name: Checkout release verification script
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Require successful pre-merge tests
      uses: actions/github-script@v7
      with:
        script: |
          const verify = require('./.github/scripts/verify-release-ci.cjs');
          await verify({ github, context, core });
  authorize-ci:
    if: >-
      ${{ github.event_name != 'workflow_dispatch' &&
          (!github.event.label || github.event.label.name == 'ok-to-test') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    steps:
    - name: Verify approval for this fork PR
      if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        repo="repos/$GITHUB_REPOSITORY"
        pr=$(gh api "$repo/pulls/$PR_NUMBER")
        if ! jq -e --arg sha "$EXPECTED_SHA" '
          .state == "open" and .head.sha == $sha and any(.labels[]; .name == "ok-to-test")
        ' <<< "$pr" >/dev/null; then
          echo "::error::The current fork PR head needs the ok-to-test label to run internal CI."
          exit 1
        fi

        # Triage users can label PRs too. Verify who applied the active label.
        approver=$(gh api --paginate --slurp "$repo/issues/$PR_NUMBER/events?per_page=100" | jq -r '
          [ .[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "ok-to-test") ]
          | last | select(.event == "labeled") | .actor.login // empty')
        if [[ -z "$approver" ]]; then
          echo "::error::Could not verify who applied ok-to-test."
          exit 1
        fi
        permission=$(gh api "$repo/collaborators/$approver/permission" --jq .permission)
        case "$permission" in
          admin|write|maintain) echo "Fork PR #$PR_NUMBER approved by $approver for internal CI." ;;
          *) echo "::error::A maintainer with write access must remove and reapply ok-to-test."; exit 1 ;;
        esac
    - name: Confirm authorization
      run: echo "CI may proceed."
  validate-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: hygon-cpu
    steps:
    - name: Validate manual build inputs
      shell: bash
      env:
        DTK_VERSION: ${{ inputs.dtk_version }}
        PYTHON_VERSION: ${{ inputs.py_version }}
        SOURCE_SHA: ${{ inputs.commit || github.sha }}
      run: |
        case "${DTK_VERSION}/${PYTHON_VERSION}" in
          26.04/3.10|26.04/3.12|26.10/3.12) ;;
          *)
            echo "Unsupported build combination: DTK ${DTK_VERSION}, Python ${PYTHON_VERSION}." >&2
            exit 1
            ;;
        esac
        if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Enter the full 40-character commit SHA, or leave commit blank." >&2
          exit 1
        fi
  build-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-manual
    name: Build DTK${{ inputs.dtk_version }} (py${{ inputs.py_version }})
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: ${{ inputs.dtk_version }}
      dtk_ver: ${{ inputs.dtk_version == '26.04' && '2604' || '2610' }}
      source_sha: ${{ inputs.commit || github.sha }}
      py_version: ${{ inputs.py_version }}
      run_tests: false
  build2604:
    needs: authorize-ci
    name: DTK2604 (py3.10)
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.04'
      dtk_ver: '2604'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      py_version: '3.10'
      numpy_version: '1.25.2'
      torch_version: '2.11.0'
      run_tests: ${{ github.event_name == 'pull_request_target' }}
  build2610:
    needs: authorize-ci
    name: DTK2610 (py3.12)
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.10'
      dtk_ver: '2610'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      py_version: '3.12'
      numpy_version: '1.26.4'
      torch_version: '2.13.0'
      run_tests: ${{ github.event_name == 'pull_request_target' }}
  publish-2604:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/0.1.0' }}
    needs:
    - build2604
    - build2610
    - verify-release-ci
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_version: '26.04'
      dtk_ver: '2604'
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  publish-2610:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/0.1.0' }}
    needs:
    - build2604
    - build2610
    - verify-release-ci
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_version: '26.10'
      dtk_ver: '2610'
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  ci-result:
    name: ${{ github.event.label && github.event.label.name != 'ok-to-test' && 'Ignored label change' || 'ci-result' }}
    if: ${{ always() && github.event_name != 'workflow_dispatch' && (!github.event.label || github.event.label.name == 'ok-to-test') }}
    needs:
    - build2604
    - build2610
    runs-on: hygon-cpu
    env:
      BUILD_2604: ${{ needs.build2604.result }}
      BUILD_2610: ${{ needs.build2610.result }}
    steps:
    - name: Require completed CI jobs
      shell: bash
      run: |
        set -euo pipefail
        test "$BUILD_2604" = success
        test "$BUILD_2610" = success
